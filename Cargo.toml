[workspace]
members = [
    "crates/chattybara-chat",
    "crates/chattybara-station",
    "crates/chattybara-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.95"
authors = ["nvk"]
license = "MIT"
description = "Terminal radio chat client with the clean-room orca modem stack."
repository = "https://github.com/nvk/chattybara"
homepage = "https://github.com/nvk/chattybara"
readme = "README.md"
keywords = ["ham-radio", "modem", "chat", "audio", "fsk"]
categories = ["command-line-utilities", "multimedia::audio", "simulation"]
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
cpal = "0.17.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.9.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
